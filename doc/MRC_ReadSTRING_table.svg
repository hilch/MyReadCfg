  <rect x="107" y="85" width="64" height="28" fill="#ffffff" stroke="#999999" />
  <text font-weight="normal" fill="#000000">
    <tspan x="115" y="101">UDINT</tspan>
  </text>
  <rect x="171" y="85" width="219" height="28" fill="#ffffff" stroke="#999999" />
  <text font-weight="normal" fill="#000000">
    <tspan x="179" y="101">char* : name of the constant</tspan>
  </text>
  <rect x="1" y="113" width="106" height="28" fill="#ffffff" stroke="#999999" />
  <text font-weight="normal" fill="#000000">
    <tspan x="9" y="129">pValue</tspan>
  </text>
  <rect x="107" y="113" width="64" height="28" fill="#ffffff" stroke="#999999" />
  <text font-weight="normal" fill="#000000">
    <tspan x="115" y="129">UDINT</tspan>
  </text>
  <rect x="171" y="113" width="219" height="28" fill="#ffffff" stroke="#999999" />
  <text font-weight="normal" fill="#000000">
    <tspan x="179" y="129">char* : destination buffer</tspan>
