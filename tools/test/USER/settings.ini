[ApplicationSettings]
; STRING
app_name=MyApplication
database_host=192.168.1.100
log_file_path=/var/logs/app.log

; DINT (32-bit Integer)
max_connections=500
port_number=8080
timeout_seconds=30

; BOOL
debug_mode=true
enable_logging=false
ssl_enabled=true

; LREAL (64-bit Float)
cpu_threshold=85.5
memory_limit_gb=4.25
